name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只安装测试实际依赖（fridamcp 核心链），
      # gradio/uvicorn 等重型依赖留给 GUI 冒烟环境
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install frida mcp loguru pytest

      - name: Compile all Python sources
        run: |
          python -m compileall -q app.py setup.py fridamcp injector

      - name: Run tests
        run: python -m pytest tests/ -v

  build-check:
    name: Packaging sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify package discovery
        run: |
          pip install setuptools
          python - <<'EOF'
          from setuptools import find_packages
          import os
          pkgs = find_packages(exclude=["tests", "tests.*"])
          required = {"fridamcp", "injector"}
          missing = required - set(pkgs)
          assert not missing, f"find_packages() lost packages: {missing}"
          assert os.path.exists("app.py"), "app.py (py_modules) missing"
          print("packages:", sorted(pkgs))
          EOF
