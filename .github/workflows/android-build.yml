name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run unit tests (REST contract + ViewModel)
        working-directory: android-app
        run: gradle test --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridaMCP-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android-app/app/build/reports/tests/test/
          retention-days: 7

  # 可选：真模拟器 e2e（手动触发；macOS runner 有硬件加速）
  emulator-e2e:
    name: Emulator E2E (manual)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            cd android-app
            gradle assembleDebug --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.yfy227.fridamcp/.MainActivity
            sleep 6
            # 崩溃检测：主进程必须存活
            adb shell pidof com.yfy227.fridamcp || (echo "PROC_DEAD"; adb logcat -d | tail -80; exit 1)
            adb shell uiautomator dump /sdcard/ui.xml
            adb pull /sdcard/ui.xml emulator-ui.xml
            grep -q "FridaMCP" emulator-ui.xml || { echo "UI_LAUNCH_FAILED"; cat emulator-ui.xml | head -5; exit 1; }
            echo "UI_LAUNCH_OK"
            adb exec-out screencap -p > emulator-screen.png

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-e2e-evidence
          path: |
            emulator-ui.xml
            emulator-screen.png
          retention-days: 14
          if-no-files-found: ignore
